# StalkerTalker settings. The app's Settings tab edits this file; restart the helper after changes.
# Keys and voice IDs stay in .env.

[Game]
# Folder where S.T.A.L.K.E.R.: Call of Pripyat is installed (the one with bin, gamedata, resources)
STALKER_DIR=C:\Games\S.T.A.L.K.E.R. Call of Pripyat

[Talking]
# all = NPCs answer your mic and talk on their own; chat = they only say Twitch chat messages. options: all, chat
SPEAK_MODE=all
# Key you hold to speak (the in-game key is set in gamedata\configs\scripts\talker.ltx)
PTT_KEY=t
# Microphone to record from. auto = laptop/wired mic, so AirPods don't switch to distorted call mode when you press T; default = Windows' mic; or part of a mic name, e.g. Microphone Array
MIC=auto
# Where NPC lines are shown. options: bottom, pda, both
SUBTITLES=bottom
# Start playing a reply while it's still being generated (faster). options: 1, 0
STREAM_VOICE=1
# Reply speed of the voices, 0.7 slowest .. 1.2 fastest
TTS_SPEED=0.85
# Overall NPC voice volume, 0..1
NPC_VOLUME=0.55
# Pause between two lines, in seconds (at least this much silence before the next one)
LINE_GAP=0.3

[NPCs on their own]
# Chance a nearby stalker greets you (checked every 2 s)
GREET_CHANCE=0.08
# Seconds between any two greetings
GREET_COOLDOWN=150
# Chance an enemy shouts at you (checked every 2 s)
HOSTILE_CHANCE=0.4
# Chance a bystander joins your conversation (once)
CHIME_CHANCE=0.25
# Reactions to your artifact pickups, anomaly hits, jams, reloads
REACT_CHANCE=0.7
REACT_COOLDOWN=45
# When you or Twitch chat talk to everybody ("всі", "пацани", "сталкери"...), up to this many men around answer
GROUP_MAX=3
GROUP_DISTANCE=15
# lead = one man answers (the squad leader if he's there) and the others only mutter around it, quieter; all = several men answer in turn. options: lead, all
GROUP_STYLE=lead
# How loud the mutters are next to the answer, 0..1
GROUP_ASIDE_VOLUME=0.45
# A companion following you talks on the way (chance per 2 s check, after the cooldown)
COMPANION_CHANCE=0.15
COMPANION_COOLDOWN=240
# Two NPCs near you talk to each other (chance per 2 s check, after the cooldown)
CHAT_CHANCE=0.04
CHAT_COOLDOWN=300
CHAT_DISTANCE=12

[Personality]
# The nickname stalkers know you by (they may call you that); empty = they don't know your name
PLAYER_NAME=
# Your character's story (quenta): what stalkers know about you. NPCs keep it in mind and treat you accordingly. Empty = nothing known
PLAYER_BIO=
# How funny and foul-mouthed stalkers are: normal = a joke now and then; high = jokes, анекдоти and creative мат often; max = shitpost mode, almost every line a joke, heavy мат, modern memes. options: normal, high, max
FUN_LEVEL=high
# Share of lines where an NPC's personal quirks show
QUIRK_CHANCE=0.3
# Talks kept word for word per NPC; older ones are folded into his memory summary
MEMORY_KEEP=6
# Forget all NPC memories every time StalkerTalker starts. options: 0, 1
CLEAR_MEMORY=0
# Share of greetings, companion talk and NPC chats about life outside the Zone (family, past, Ukraine and world news), 0..1
OUTSIDE_TALK=0.5
# Real headlines stalkers can talk about: default (Суспільне, BBC Україна, ТСН), off, or your own RSS links, comma separated
NEWS_FEEDS=default

[Twitch]
# Turn Twitch on. options: 1, 0
TWITCH_ENABLED=0
# chat = chat messages starting with $ or % are spoken (works without Affiliate); reward = channel-points reward (needs Affiliate/Partner). Both need TWITCH_CLIENT_ID in .env. options: chat, reward
TWITCH_SOURCE=chat
# Whose chat to read: channel name or link. Empty = your own channel
TWITCH_CHANNEL=
# At most this many messages wait; older ones are dropped when chat is busy
TWITCH_QUEUE_MAX=20
# reward mode only: reward title, created automatically (Affiliate/Partner)
TWITCH_REWARD=Скажи через сталкера
TWITCH_COST=500
# Start a message with $ to have it said word for word, with % to have the NPC retell it his own way.
# Messages without $ or %: ignore = stay quiet (default), or speak them anyway. options: ignore, verbatim, character
TWITCH_UNPREFIXED=ignore
# NPCs within this many metres can be picked; if nobody is close, the message waits
TWITCH_DISTANCE=25
# Put the line in the PDA under the speaking NPC, starting with [viewer nickname]. options: 1, 0
TWITCH_SHOW_NAME=1
# Each viewer keeps his own NPC (his nick shows next to the NPC's name; %% in chat lets go of him).
# 0 = every message goes through any NPC nearby, no links, no nick labels. options: 1, 0
TWITCH_LINKS=1
# Messages with any of these words are skipped and refunded (comma separated)
TWITCH_BLOCKED=
# Zone events: the title of a channel-points reward you make yourself on Twitch (no message needed; Affiliate/Partner).
# Each redemption rolls a random event: a gift (25%), a stalker friend or enemy with the viewer's nick (50%), mutants (25%).
# Works in both chat and reward mode, on your own channel. Empty = off
TWITCH_ZONE_REWARD=
# Minutes between two Zone events (and from a redemption to its event), e.g. 5-7
TWITCH_ZONE_GAP=5-7

[AI models]
# Who writes NPC lines: claude = your Claude subscription through Claude Code (sign in once: run claude, then /login); claude-api = ANTHROPIC_API_KEY; gemini = GEMINI_API_KEY. If Claude can't answer, Gemini stands in. options: claude, claude-api, gemini
LLM_PROVIDER=gemini
# Claude model: claude-haiku-5-5 is the fastest; claude-sonnet-5-5 is smarter but slower
CLAUDE_MODEL=claude-haiku-5-5
# Full path to the Claude Code program
CLAUDE_CLI=claude
# Model for normal NPC replies (fastest right now: gemini-3.1-flash-lite)
GEMINI_MODEL=gemini-3.1-flash-lite
# Model for long messages and deals
GEMINI_SMART_MODEL=gemini-3.1-flash-lite
# Speech recognition models, tried in this order
STT_MODELS=gemini-3.1-flash-lite,gemini-3.5-flash-lite
